# Oracle MySQL 8.4 전용 (MariaDB와 포트 분리)
# 경로에 공백 없음 → Windows 서비스에서 안정적
#
# 사용 전: 이 파일을 C:\mysql84\my.ini 로 복사하거나,
#           setup-mysql84-admin.bat 이 같은 폴더에 두고 관리자 실행

[client]
port=3307
default-character-set=utf8mb4

[mysql]
default-character-set=utf8mb4

[mysqld]
port=3307
datadir=C:/mysql84/data
character-set-server=utf8mb4
collation-server=utf8mb4_general_ci
default_authentication_plugin=caching_sha2_password
